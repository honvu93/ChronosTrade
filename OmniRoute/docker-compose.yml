services:
  omniroute-a:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-a
    restart: unless-stopped
    env_file:
      - .env.omniroute-a
    ports:
      - "30120:30120"
    volumes:
      - omniroute-data-a:/app/data

  omniroute-b:
    build:
      context: .
      dockerfile: Dockerfile.codex
    image: omniroute:codex-b
    container_name: omniroute-b
    restart: unless-stopped
    env_file:
      - .env.omniroute-b
    ports:
      - "30130:30130"
    volumes:
      - omniroute-data-b:/app/data
      - /Users/youruser/Public/antigravity/one:/workspace/one
      - ./.codex/omniroute-b/config.toml:/root/.codex/config.toml:ro
      - ./.codex/omniroute-b/auth.json:/root/.codex/auth.json:ro
    networks:
      - default
      - antigravity-shared

  omniroute-c:
    image: diegosouzapw/omniroute:latest
    container_name: omniroute-c
    restart: unless-stopped
    env_file:
      - .env.omniroute-c
    ports:
      - "30140:30140"
    volumes:
      - omniroute-data-c:/app/data

volumes:
  omniroute-data-a:
    name: omniroute-data-a
  omniroute-data-b:
    name: omniroute-data-b
  omniroute-data-c:
    name: omniroute-data-c

networks:
  antigravity-shared:
    external: true
    name: antigravity-shared
